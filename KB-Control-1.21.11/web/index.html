<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KB Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <p class="eyebrow">FABRIC SERVER CONFIGURATION</p>
    <h1>KB CONTROL</h1>
    <p class="muted">Minecraft 1.21.11 · Admin configuration dashboard</p>

    <label for="enabled">Configuration enabled</label>
    <select id="enabled">
      <option value="true">Enabled</option>
      <option value="false">Disabled</option>
    </select>

    <label for="horizontal">Horizontal multiplier <output id="horizontalOut">1.00</output></label>
    <input id="horizontal" type="range" min="0.1" max="2" step="0.05" value="1">

    <label for="vertical">Vertical multiplier <output id="verticalOut">1.00</output></label>
    <input id="vertical" type="range" min="0.1" max="2" step="0.05" value="1">

    <label for="preset">Preset</label>
    <select id="preset">
      <option value="standard">Standard</option>
      <option value="reduced">Reduced</option>
      <option value="custom">Custom</option>
    </select>

    <h2>JSON preview</h2>
    <pre id="preview"></pre>
    <button id="export">Export knockback.json</button>
    <p class="note">Export the file and place it in the server's config folder. Then run /kb reload.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
